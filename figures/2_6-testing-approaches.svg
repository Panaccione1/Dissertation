<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330"
  font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <rect width="480" height="330" fill="#ffffff"/>

  <!-- ══════════════════════════════
       ROOT
  ══════════════════════════════ -->
  <rect x="110" y="10" width="260" height="30" rx="3" fill="#1a5c38"/>
  <text x="240" y="30" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">
    Testing Approaches
  </text>

  <!-- trunk + horizontal bus -->
  <line x1="240" y1="40" x2="240" y2="56" stroke="#888" stroke-width="1.2"/>
  <line x1="100" y1="56" x2="380" y2="56" stroke="#888" stroke-width="1.2"/>

  <!-- category stems -->
  <line x1="100" y1="56" x2="100" y2="74" stroke="#888" stroke-width="1.2"/>
  <line x1="240" y1="56" x2="240" y2="74" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="56" x2="380" y2="74" stroke="#888" stroke-width="1.2"/>

  <!-- ══════════════════════════════
       CATEGORY BOXES
  ══════════════════════════════ -->
  <rect x="54"  y="74" width="92" height="28" rx="3" fill="#1a8c7a"/>
  <text x="100" y="93" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Static</text>

  <rect x="194" y="74" width="92" height="28" rx="3" fill="#1a8c7a"/>
  <text x="240" y="93" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Dynamic</text>

  <rect x="325" y="74" width="110" height="28" rx="3" fill="#1a8c7a"/>
  <text x="380" y="88" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Fault</text>
  <text x="380" y="100" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Injection</text>

  <!-- ══════════════════════════════
       STATIC leaves
       Formal Verification, Timing Analysis,
       Design Rule Check, Lint / CDC Check
  ══════════════════════════════ -->
  <line x1="100" y1="102" x2="100" y2="114" stroke="#888" stroke-width="1.2"/>

  <line x1="100" y1="114" x2="100" y2="124" stroke="#888" stroke-width="1.2"/>
  <rect x="54" y="124" width="92" height="34" rx="3" fill="#5ec8a0"/>
  <text x="100" y="137" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Formal</text>
  <text x="100" y="150" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Verification</text>

  <line x1="100" y1="158" x2="100" y2="168" stroke="#888" stroke-width="1.2"/>
  <rect x="54" y="168" width="92" height="34" rx="3" fill="#5ec8a0"/>
  <text x="100" y="181" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Static Timing</text>
  <text x="100" y="194" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Analysis</text>

  <line x1="100" y1="202" x2="100" y2="212" stroke="#888" stroke-width="1.2"/>
  <rect x="54" y="212" width="92" height="34" rx="3" fill="#5ec8a0"/>
  <text x="100" y="225" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Design Rule</text>
  <text x="100" y="238" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Check (DRC)</text>

  <line x1="100" y1="246" x2="100" y2="256" stroke="#888" stroke-width="1.2"/>
  <rect x="54" y="256" width="92" height="34" rx="3" fill="#5ec8a0"/>
  <text x="100" y="269" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Lint /</text>
  <text x="100" y="282" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">CDC Check</text>

  <!-- ══════════════════════════════
       DYNAMIC leaves
       Functional Simulation, BIST,
       Boundary Scan (JTAG), Hardware-in-the-Loop
  ══════════════════════════════ -->
  <line x1="240" y1="102" x2="240" y2="114" stroke="#888" stroke-width="1.2"/>

  <line x1="240" y1="114" x2="240" y2="124" stroke="#888" stroke-width="1.2"/>
  <rect x="194" y="124" width="92" height="34" rx="3" fill="#5ec8a0"/>
  <text x="240" y="137" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Functional</text>
  <text x="240" y="150" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Simulation</text>

  <line x1="240" y1="158" x2="240" y2="168" stroke="#888" stroke-width="1.2"/>
  <rect x="194" y="168" width="92" height="34" rx="3" fill="#5ec8a0"/>
  <text x="240" y="181" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Built-In</text>
  <text x="240" y="194" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Self-Test (BIST)</text>

  <line x1="240" y1="202" x2="240" y2="212" stroke="#888" stroke-width="1.2"/>
  <rect x="194" y="212" width="92" height="34" rx="3" fill="#5ec8a0"/>
  <text x="240" y="225" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Boundary Scan</text>
  <text x="240" y="238" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">(JTAG)</text>

  <line x1="240" y1="246" x2="240" y2="256" stroke="#888" stroke-width="1.2"/>
  <rect x="194" y="256" width="92" height="34" rx="3" fill="#5ec8a0"/>
  <text x="240" y="269" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Hardware-in-</text>
  <text x="240" y="282" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">the-Loop</text>

  <!-- ══════════════════════════════
       FAULT INJECTION leaves
       SEU Emulation, Radiation Testing,
       Laser Injection, SW-Based FI
  ══════════════════════════════ -->
  <line x1="380" y1="108" x2="380" y2="114" stroke="#888" stroke-width="1.2"/>

  <line x1="380" y1="114" x2="380" y2="124" stroke="#888" stroke-width="1.2"/>
  <rect x="325" y="124" width="110" height="34" rx="3" fill="#5ec8a0"/>
  <text x="380" y="137" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">SEU</text>
  <text x="380" y="150" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Emulation</text>

  <line x1="380" y1="158" x2="380" y2="168" stroke="#888" stroke-width="1.2"/>
  <rect x="325" y="168" width="110" height="34" rx="3" fill="#5ec8a0"/>
  <text x="380" y="181" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Radiation</text>
  <text x="380" y="194" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Testing</text>

  <line x1="380" y1="202" x2="380" y2="212" stroke="#888" stroke-width="1.2"/>
  <rect x="325" y="212" width="110" height="34" rx="3" fill="#5ec8a0"/>
  <text x="380" y="225" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Laser / Pin</text>
  <text x="380" y="238" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Injection</text>

  <line x1="380" y1="246" x2="380" y2="256" stroke="#888" stroke-width="1.2"/>
  <rect x="325" y="256" width="110" height="34" rx="3" fill="#5ec8a0"/>
  <text x="380" y="269" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">SW-Based</text>
  <text x="380" y="282" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Fault Injection</text>

  <!-- border -->
  <rect x="4" y="4" width="472" height="322" rx="3" fill="none" stroke="#a0c8b4" stroke-width="1"/>

</svg>
