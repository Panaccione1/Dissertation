<svg viewBox="0 0 1270 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Source+Sans+3:wght@300;400;600&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1270" height="440" fill="#ffffff"/>

  <!-- ROOT → L1 connectors -->
  <path fill="none" stroke="#333333" stroke-width="1.2" d="M815,82 L815,108 L490,108 L490,135"/>
  <path fill="none" stroke="#333333" stroke-width="1.2" d="M815,108 L1140,108 L1140,135"/>

  <!-- SEE bus -->
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="490" y1="185" x2="490" y2="220"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="85"  y1="220" x2="895" y2="220"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="85"  y1="220" x2="85"  y2="250"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="247" y1="220" x2="247" y2="250"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="409" y1="220" x2="409" y2="250"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="571" y1="220" x2="571" y2="250"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="733" y1="220" x2="733" y2="250"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="895" y1="220" x2="895" y2="250"/>

  <!-- CUM bus -->
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="1140" y1="185" x2="1140" y2="220"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="1055" y1="220" x2="1210" y2="220"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="1055" y1="220" x2="1055" y2="250"/>
  <line fill="none" stroke="#333333" stroke-width="1.2" x1="1210" y1="220" x2="1210" y2="250"/>

  <!-- ROOT (cx=815) -->
  <rect x="685" y="22" width="260" height="60" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="1.5"/>
  <text x="815" y="49" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="16" font-weight="600" fill="#111111">Radiation Effects</text>
  <text x="815" y="68" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9.5" fill="#555555">Space &amp; High-Energy Particle Environments</text>

  <!-- L1: Single-Event Effects (cx=490) -->
  <rect x="350" y="135" width="280" height="50" rx="3" fill="#dce8f5" stroke="#2a5a8c" stroke-width="1.2"/>
  <text x="490" y="157" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#1a3d5c">Single-Event Effects</text>
  <text x="490" y="174" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9.5" fill="#3a5f80">Ion or proton strike in sensitive volume</text>

  <!-- L1: Cumulative Effects (cx=1140) -->
  <rect x="1000" y="135" width="280" height="50" rx="3" fill="#e8e0f0" stroke="#5a3a8c" stroke-width="1.2"/>
  <text x="1140" y="157" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#3a1f6a">Cumulative Effects</text>
  <text x="1140" y="174" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9.5" fill="#5a3a8c">Long-duration exposure degradation</text>

  <!-- SEU cx=85 -->
  <rect x="10"  y="250" width="150" height="138" rx="3" fill="#eef4fb" stroke="#2a5a8c" stroke-width="1"/>
  <text x="85"  y="273" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#1a3d5c">SEU</text>
  <text x="85"  y="288" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9" fill="#444444">Single-Event Upset</text>
  <line x1="18"  y1="298" x2="152" y2="298" stroke="#aac4de" stroke-width="0.75"/>
  <text x="85"  y="312" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">Bit-flip in memory cell</text>
  <text x="85"  y="324" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">or register; soft error</text>
  <text x="85"  y="336" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">(non-destructive,</text>
  <text x="85"  y="348" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">recoverable)</text>

  <!-- SET cx=247 -->
  <rect x="172" y="250" width="150" height="138" rx="3" fill="#eef4fb" stroke="#2a5a8c" stroke-width="1"/>
  <text x="247" y="273" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#1a3d5c">SET</text>
  <text x="247" y="288" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9" fill="#444444">Single-Event Transient</text>
  <line x1="180" y1="298" x2="314" y2="298" stroke="#aac4de" stroke-width="0.75"/>
  <text x="247" y="312" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">Spurious voltage pulse</text>
  <text x="247" y="324" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">in analog or combinational</text>
  <text x="247" y="336" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">logic; may propagate</text>
  <text x="247" y="348" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">as a soft error</text>

  <!-- SEFI cx=409 -->
  <rect x="334" y="250" width="150" height="138" rx="3" fill="#eef4fb" stroke="#2a5a8c" stroke-width="1"/>
  <text x="409" y="273" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#1a3d5c">SEFI</text>
  <text x="409" y="288" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9" fill="#444444">SE Functional Interrupt</text>
  <line x1="342" y1="298" x2="476" y2="298" stroke="#aac4de" stroke-width="0.75"/>
  <text x="409" y="312" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">Upset in control logic</text>
  <text x="409" y="324" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">(FSM, config register);</text>
  <text x="409" y="336" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">disrupts operation;</text>
  <text x="409" y="348" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">reset-recoverable</text>

  <!-- SEL cx=571 -->
  <rect x="496" y="250" width="150" height="138" rx="3" fill="#fdf0ee" stroke="#8c2a2a" stroke-width="1"/>
  <text x="571" y="273" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#6b1a1a">SEL</text>
  <text x="571" y="288" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9" fill="#444444">Single-Event Latch-up</text>
  <line x1="504" y1="298" x2="638" y2="298" stroke="#d4a8a8" stroke-width="0.75"/>
  <text x="571" y="312" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">Parasitic PNPN (SCR)</text>
  <text x="571" y="324" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">triggered; high current</text>
  <text x="571" y="336" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">state; potentially</text>
  <text x="571" y="348" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">destructive</text>

  <!-- SEB cx=733 -->
  <rect x="658" y="250" width="150" height="138" rx="3" fill="#fdf0ee" stroke="#8c2a2a" stroke-width="1"/>
  <text x="733" y="273" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#6b1a1a">SEB</text>
  <text x="733" y="288" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9" fill="#444444">Single-Event Burnout</text>
  <line x1="666" y1="298" x2="800" y2="298" stroke="#d4a8a8" stroke-width="0.75"/>
  <text x="733" y="312" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">Destructive thermal</text>
  <text x="733" y="324" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">runaway in power</text>
  <text x="733" y="336" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">MOSFETs &amp; bipolar</text>
  <text x="733" y="348" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">devices</text>

  <!-- SEGR cx=895 -->
  <rect x="820" y="250" width="150" height="138" rx="3" fill="#fdf0ee" stroke="#8c2a2a" stroke-width="1"/>
  <text x="895" y="273" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#6b1a1a">SEGR</text>
  <text x="895" y="288" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9" fill="#444444">SE Gate Rupture</text>
  <line x1="828" y1="298" x2="962" y2="298" stroke="#d4a8a8" stroke-width="0.75"/>
  <text x="895" y="312" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">Gate oxide dielectric</text>
  <text x="895" y="324" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">breakdown; permanent</text>
  <text x="895" y="336" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">device failure in</text>
  <text x="895" y="348" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">power MOSFETs</text>

  <!-- TID cx=1055 -->
  <rect x="980"  y="250" width="150" height="138" rx="3" fill="#f3eff8" stroke="#5a3a8c" stroke-width="1"/>
  <text x="1055" y="273" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#3a1f6a">TID</text>
  <text x="1055" y="288" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9" fill="#444444">Total Ionizing Dose</text>
  <line x1="988"  y1="298" x2="1122" y2="298" stroke="#c0aedd" stroke-width="0.75"/>
  <text x="1055" y="312" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">Charge trapping in</text>
  <text x="1055" y="324" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">oxide; Vth shift and</text>
  <text x="1055" y="336" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">leakage increase</text>
  <text x="1055" y="348" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">(krad / Mrad metric)</text>

  <!-- DD cx=1210 -->
  <rect x="1135" y="250" width="150" height="138" rx="3" fill="#f3eff8" stroke="#5a3a8c" stroke-width="1"/>
  <text x="1210" y="273" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#3a1f6a">DD</text>
  <text x="1210" y="288" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="9" fill="#444444">Displacement Damage</text>
  <line x1="1143" y1="298" x2="1277" y2="298" stroke="#c0aedd" stroke-width="0.75"/>
  <text x="1210" y="312" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">Crystal lattice defects;</text>
  <text x="1210" y="324" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">minority carrier lifetime</text>
  <text x="1210" y="336" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">reduction (NIEL</text>
  <text x="1210" y="348" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="8.5" fill="#555555">MeV·cm²/g metric)</text>

  <!-- Legend -->
  <rect x="10"  y="408" width="10" height="10" rx="1" fill="#dce8f5" stroke="#2a5a8c" stroke-width="1"/>
  <text x="26"  y="417" font-family="'Source Sans 3', Arial, sans-serif" font-size="9.5" fill="#333333">Soft / Recoverable (SEU, SET, SEFI)</text>

  <rect x="255" y="408" width="10" height="10" rx="1" fill="#fdf0ee" stroke="#8c2a2a" stroke-width="1"/>
  <text x="271" y="417" font-family="'Source Sans 3', Arial, sans-serif" font-size="9.5" fill="#333333">Potentially Destructive (SEL, SEB, SEGR)</text>

  <rect x="545" y="408" width="10" height="10" rx="1" fill="#f3eff8" stroke="#5a3a8c" stroke-width="1"/>
  <text x="561" y="417" font-family="'Source Sans 3', Arial, sans-serif" font-size="9.5" fill="#333333">Cumulative / Permanent Degradation (TID, DD)</text>

</svg>
